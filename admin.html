<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adorn — Owner</title><style>body{margin:0;background:#050505;color:#eee;font-family:Arial;padding:30px}.wrap{max-width:900px;margin:auto}.box{border:1px solid #292929;padding:24px;background:#0b0b0b;margin:18px 0}input,button{width:100%;padding:13px;margin:7px 0;background:#111;color:#eee;border:1px solid #444;box-sizing:border-box}button{cursor:pointer;background:#eee;color:#000;font-weight:700}.danger{background:#222;color:#fff}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{border:1px solid #292929;padding:15px}.preview{width:100%;aspect-ratio:1;object-fit:cover;background:#151515}.small{color:#888;font-size:12px;line-height:1.6}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>ADORN — OWNER</h1><p class="small">Owner panel. Changes are saved in this browser. To publish them to the public GitHub site, use the exported product data or update the site files. For true secure online editing, this panel must later be connected to a server/database.</p><div id="login" class="box"><h2>Owner Login</h2><input id="pass" type="password" placeholder="Owner password"><button onclick="login()">ENTER</button><p id="msg" class="small"></p></div><div id="panel" class="hidden"><div class="box"><button onclick="addProduct()">+ ADD PRODUCT</button><button onclick="saveAll()">SAVE PRODUCTS</button><button onclick="exportData()">EXPORT PRODUCTS JSON</button><button class="danger" onclick="logout()">LOG OUT</button></div><div id="products" class="grid"></div></div></div><script>
const PASS_HASH='4e934f6b56b896e47c87dc81277f494fb0d3fc960941e7513a228d1d2fda9baa';
const defaultProducts=[{name:'Signature Ring',desc:'Stainless steel',price:'EGP 000',image:''},{name:'Classic Chain',desc:'Stainless steel',price:'EGP 000',image:''},{name:'Essential Bracelet',desc:'Stainless steel',price:'EGP 000',image:''}];
let products=JSON.parse(localStorage.getItem('adornProducts')||'null')||defaultProducts;
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function login(){const h=await sha(document.getElementById('pass').value);if(h===PASS_HASH){sessionStorage.adornOwner='1';show()}else document.getElementById('msg').textContent='Wrong password.'}
function show(){loginBox.classList.add('hidden');panel.classList.remove('hidden');render()} function logout(){sessionStorage.removeItem('adornOwner');location.reload()}
function render(){productsDiv.innerHTML=products.map((p,i)=>`<div class="card"><img class="preview" src="${p.image||'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22400%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%23151515%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 fill=%22%23666%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22 font-family=%22Arial%22 font-size=%2216%22%3EYOUR PHOTO%3C/text%3E%3C/svg%3E'}"><input value="${esc(p.name)}" onchange="products[${i}].name=this.value"><input value="${esc(p.desc)}" onchange="products[${i}].desc=this.value"><input value="${esc(p.price)}" onchange="products[${i}].price=this.value"><input type="file" accept="image/*" onchange="pickImage(event,${i})"><button class="danger" onclick="removeProduct(${i})">DELETE</button></div>`).join('')}
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function pickImage(e,i){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{products[i].image=r.result;render()};r.readAsDataURL(f)}
function addProduct(){products.push({name:'New Product',desc:'Stainless steel',price:'EGP 000',image:''});render()}
function removeProduct(i){products.splice(i,1);render()}
function saveAll(){localStorage.setItem('adornProducts',JSON.stringify(products));alert('Saved on this browser.');}
function exportData(){saveAll();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(products,null,2)],{type:'application/json'}));a.download='adorn-products.json';a.click()}
const loginBox=document.getElementById('login'),panel=document.getElementById('panel'),productsDiv=document.getElementById('products'); if(sessionStorage.adornOwner==='1')show();
</script></body></html>
